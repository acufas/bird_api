[project]
name = "bird-api"
version = "0.1.0"
description = "Bird API built with FastAPI"
readme = "README.md"
authors = [
    { name = "Aaron Simpson", email = "aaron@aaronsimpson.org" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard]>=0.149.0",
    "pydantic-settings>=2.16.0",
    "sqlmodel>=0.0.48",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 130
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]
"migrations/env.py" = ["F401"]

[tool.mypy]
files = ["app", "tests", "migrations"]
plugins = ["pydantic.mypy"]
strict = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
